<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OpenKoASR Korean ASR Leaderboard</title>
  <desc id="desc">A preview card for the OpenKoASR Korean automatic speech recognition benchmark and leaderboard.</desc>
  <rect width="1200" height="630" fill="#f6f7f2"/>
  <rect x="64" y="56" width="1072" height="518" rx="28" fill="#ffffff" stroke="#d9ded3" stroke-width="2"/>
  <rect x="96" y="88" width="112" height="112" rx="20" fill="#17211c"/>
  <text x="152" y="154" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff">OK</text>
  <text x="236" y="126" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#147c74">OpenKoASR</text>
  <text x="236" y="170" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="800" fill="#17211c">Korean ASR Leaderboard</text>
  <text x="236" y="226" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#66736a">Reproducible WER, CER, RTF, and latency results</text>

  <g transform="translate(96 286)">
    <rect width="1008" height="214" rx="18" fill="#fbfcf9" stroke="#d9ded3"/>
    <rect x="24" y="24" width="960" height="42" rx="10" fill="#17211c"/>
    <text x="52" y="52" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Rank</text>
    <text x="156" y="52" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Model</text>
    <text x="430" y="52" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Dataset</text>
    <text x="710" y="52" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">CER</text>
    <text x="820" y="52" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">WER</text>
    <text x="930" y="52" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">RTFx</text>

    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#17211c">
      <text x="52" y="102" font-weight="800">1</text>
      <text x="156" y="102" font-weight="800">qwen3_asr_1_7b</text>
      <text x="430" y="102" fill="#66736a">Kspon other</text>
      <text x="710" y="102" font-weight="800">0.1431</text>
      <text x="820" y="102">0.3999</text>
      <text x="930" y="102">0.0489</text>
      <rect x="24" y="120" width="960" height="1" fill="#d9ded3"/>

      <text x="52" y="154" font-weight="800">2</text>
      <text x="156" y="154" font-weight="800">qwen3_asr_0_6b</text>
      <text x="430" y="154" fill="#66736a">Kspon other</text>
      <text x="710" y="154" font-weight="800">0.1626</text>
      <text x="820" y="154">0.4295</text>
      <text x="930" y="154">0.1053</text>
      <rect x="24" y="172" width="960" height="1" fill="#d9ded3"/>

      <text x="52" y="206" font-weight="800">3</text>
      <text x="156" y="206" font-weight="800">whisper_medium</text>
      <text x="430" y="206" fill="#66736a">Kspon clean</text>
      <text x="710" y="206" font-weight="800">0.2101</text>
      <text x="820" y="206">0.4472</text>
      <text x="930" y="206">0.0701</text>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800">
    <rect x="96" y="524" width="154" height="42" rx="21" fill="#d9efeb"/>
    <text x="173" y="551" text-anchor="middle" fill="#0d5d58">Whisper</text>
    <rect x="266" y="524" width="166" height="42" rx="21" fill="#f5e8c7"/>
    <text x="349" y="551" text-anchor="middle" fill="#5f410b">Qwen3-ASR</text>
    <rect x="448" y="524" width="178" height="42" rx="21" fill="#e6edf5"/>
    <text x="537" y="551" text-anchor="middle" fill="#356799">KsponSpeech</text>
    <rect x="642" y="524" width="154" height="42" rx="21" fill="#f3e6e4"/>
    <text x="719" y="551" text-anchor="middle" fill="#a8463f">AIHub</text>
